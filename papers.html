<!DOCTYPE html>
<link id="cssLink" rel="stylesheet" type="text/css" href="basic.css">
<link rel="script" type="text/javascript" href="andy.js">
<link rel="icon" href="images/penta.png">

<link href='https://fonts.googleapis.com/css?family=Playfair Display' rel='stylesheet'>

<html>

<head class="header">
    <title>Andy J Yang
    </title>


</head>

<script>
    function toggleCSS() {
        var currentCSS = document.getElementById("cssLink");
        if (currentCSS.getAttribute("href") === "tree.css") {
            currentCSS.setAttribute("href", "basic.css");
            document.getElementById("info").style.display = "none";
        } else {
            currentCSS.setAttribute("href", "tree.css");
            document.getElementById("info").style.display = "block";
        }
    }
</script>

<body>
    <div style="height:0px; background-color: var(--leaf-color);">
        <div class="header">
            <h1 style="margin-top: 80px; margin-bottom: 0;"> <a href="index.html">Andy J Yang</a> </h1>
            <h3 style="margin-top: 0;"> <a href="index.html"> 杨加锋 </a> </h3>
            <!-- <img style="float:center" src="images/monky.jpg" alt="andy" height="200"> -->

        </div>
    </div>

    <div class="trunk">
        <div id="info" class="leftbranch" style="display:none">
            There are links on the tree branches below. Please click on them.
        </div>
        <div class="leftbranch">
            Selected publications (see also my <a
                href="https://scholar.google.com/citations?user=HtIIULQAAAAJ&hl=en">Google
                Scholar</a> page):
            <br>
            <br>
            <div id="papers-list" class="leftsubbranch">Loading publications&hellip;</div>
            <div class="footer">
                <!-- <a href="">Home</a> -->
                <br>
                <!-- <button onclick="toggleCSS()">Toggle CSS</button> -->
            </div>

            <script>
                // Renders the publication list from files/papers.csv, so new papers
                // can be added by editing that CSV instead of this HTML.
                function parseCSV(text) {
                    const rows = [];
                    let row = [], field = '', inQuotes = false;
                    for (let i = 0; i < text.length; i++) {
                        const c = text[i];
                        if (inQuotes) {
                            if (c === '"') {
                                if (text[i + 1] === '"') { field += '"'; i++; }
                                else { inQuotes = false; }
                            } else {
                                field += c;
                            }
                        } else if (c === '"') {
                            inQuotes = true;
                        } else if (c === ',') {
                            row.push(field);
                            field = '';
                        } else if (c === '\n' || c === '\r') {
                            if (c === '\r' && text[i + 1] === '\n') i++;
                            row.push(field);
                            field = '';
                            if (row.length > 1 || row[0] !== '') rows.push(row);
                            row = [];
                        } else {
                            field += c;
                        }
                    }
                    if (field !== '' || row.length > 0) {
                        row.push(field);
                        rows.push(row);
                    }
                    return rows;
                }

                function formatAuthors(authors) {
                    if (authors.length === 1) return authors[0];
                    if (authors.length === 2) return authors[0] + ' and ' + authors[1];
                    return authors.slice(0, -1).join(', ') + ', and ' + authors[authors.length - 1];
                }

                async function loadPapers() {
                    const container = document.getElementById('papers-list');
                    try {
                        const response = await fetch('files/papers.csv');
                        const text = await response.text();
                        const rows = parseCSV(text).filter(r => r.some(cell => cell.trim() !== ''));
                        const header = rows[0];
                        const col = name => header.indexOf(name);
                        const titleCol = col('title'), urlCol = col('url'), authorsCol = col('authors'),
                            venueCol = col('venue'), yearCol = col('year');

                        container.innerHTML = '';
                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            const authors = row[authorsCol].split(';').map(a => a.trim());

                            const entry = document.createElement('div');
                            entry.className = 'leftsubbranch';

                            const link = document.createElement('a');
                            link.href = row[urlCol];
                            link.textContent = row[titleCol];
                            entry.appendChild(link);
                            entry.appendChild(document.createElement('br'));

                            const span = document.createElement('span');
                            span.style.fontSize = 'small';
                            span.appendChild(document.createTextNode(formatAuthors(authors) + '.'));
                            span.appendChild(document.createElement('br'));
                            span.appendChild(document.createTextNode(row[venueCol] + ', ' + row[yearCol] + '.'));
                            entry.appendChild(span);

                            container.appendChild(entry);
                        }
                    } catch (err) {
                        container.textContent = 'Could not load publications.';
                        console.error(err);
                    }
                }

                loadPapers();
            </script>
</body>

</html>
